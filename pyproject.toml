[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "arch-update-deck"
dynamic = ["version"]
description = "Safe, supervised Arch Linux updates: an interactive menu, read-only checks and an unattended weekly update"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"

[project.urls]
Homepage = "https://github.com/zzallirog/arch-update-deck"
Source = "https://github.com/zzallirog/arch-update-deck"

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
arch-update = "arch_updater.main:main"

[tool.setuptools]
packages = ["arch_updater"]

[tool.setuptools.dynamic]
version = {attr = "arch_updater.__version__"}

[tool.setuptools.package-data]
arch_updater = ["control.tis", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
